<script>
/* ============================================
   CLOUD CHAMBER BACKGROUND
============================================ */
const canvas = document.getElementById("cloudChamber");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

window.addEventListener("mousemove", (e) => {
    for (let i = 0; i < 1; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * 1.5;
        particles.push({
            x: e.clientX,
            y: e.clientY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            width: 1 + Math.random() * 1.5,
            length: 20 + Math.random() * 50
        });
    }
});

function animateCloudChamber() {
    requestAnimationFrame(animateCloudChamber);

    ctx.fillStyle = "rgba(5, 7, 19, 0.22)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;

        ctx.save();
        ctx.globalAlpha = p.life * 0.6;

        const g = ctx.createLinearGradient(
            p.x, p.y,
            p.x - p.vx * p.length,
            p.y - p.vy * p.length
        );
        g.addColorStop(0, "rgba(160,220,255,1)");
        g.addColorStop(1, "rgba(0,80,180,0)");

        ctx.strokeStyle = g;
        ctx.lineWidth = p.width;

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(
            p.x - p.vx * p.length,
            p.y - p.vy * p.length
        );
        ctx.stroke();

        ctx.restore();
    });
}
animateCloudChamber();



/* ============================================
   ANALYZE BUTTON — MULTI-STAGE + RESET
============================================ */

const analysisImage = document.getElementById("analysisImage");
const analyzeBtn = document.getElementById("analyzeButton");

// Create RESET button
const resetBtn = document.createElement("button");
resetBtn.innerText = "Reset";
resetBtn.id = "resetButton";
resetBtn.style.display = "none";
resetBtn.style.marginTop = "1rem";
resetBtn.style.padding = "10px 18px";
resetBtn.style.fontSize = "1.1rem";
resetBtn.style.background = "#ff3366";
resetBtn.style.color = "black";
resetBtn.style.border = "none";
resetBtn.style.borderRadius = "8px";
resetBtn.style.cursor = "pointer";
resetBtn.style.fontWeight = "bold";
resetBtn.style.transition = "0.2s";

analyzeBtn.insertAdjacentElement("afterend", resetBtn);

// Loading bar
const loadingContainer = document.getElementById("loadingBarContainer");
const loadingBar = document.getElementById("loadingBar");

// Image sequence
const frames = [
    "Images/Animation_fig_1.png",
    "Images/Animation_fig_2.png",
    "Images/Animation_fig_3.png"
];

let stage = 0;  // 0 → 1 → 2

function runAnalysisStep() {
    if (stage >= 2) return; // stop at last frame

    analyzeBtn.style.display = "none";
    loadingContainer.style.display = "block";
    loadingBar.style.width = "0%";

    // animate the loading bar
    setTimeout(() => {
        loadingBar.style.width = "100%";
    }, 50);

    // after 3 seconds → change image
    setTimeout(() => {
        analysisImage.style.opacity = 0;

        setTimeout(() => {
            stage += 1;
            analysisImage.src = frames[stage];
            analysisImage.style.opacity = 1;

            loadingContainer.style.display = "none";

            // show analyze button if not done
            if (stage < 2) {
                analyzeBtn.style.display = "inline-block";
            } else {
                resetBtn.style.display = "inline-block";
            }

        }, 500);
    }, 3000);
}


analyzeBtn.addEventListener("click", runAnalysisStep);


// RESET LOGIC
resetBtn.addEventListener("click", () => {
    stage = 0;
    analysisImage.style.opacity = 0;

    setTimeout(() => {
        analysisImage.src = frames[0];
        analysisImage.style.opacity = 1;
    }, 300);

    analyzeBtn.style.display = "inline-block";
    resetBtn.style.display = "none";
});


/* ============================================
   IMAGE FADE-IN ON SCROLL (for static ones)
============================================ */
const graphic = document.querySelector(".graphic-container");
window.addEventListener("scroll", () => {
    const rect = graphic.getBoundingClientRect();
    if (rect.top < window.innerHeight * 0.8)
        graphic.style.opacity = 1;
});
</script>
