<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorized Notes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050713;
    color: white;
}

.container {
    max-width: 800px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(21,25,46,0.95);
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
}

input,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #111827;
    color: white;
    font-size: 1rem;
}

button {
    margin-top: 15px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #00aaff;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
}

button:hover {
    background: #33bbff;
}

#error {
    color: #ff7777;
    margin-top: 15px;
}

#commentSection {
    display: none;
}

textarea {
    min-height: 250px;
    resize: vertical;
}

.back-link {
    color: #87CEFA;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container" id="loginSection">

    <h1>Authorized Access</h1>

    <p>Enter your username and password.</p>

    <input id="username" type="text" placeholder="Username">

    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="error"></div>

</div>

<div class="container" id="commentSection">

    <h1>Leave a Note</h1>

    <p>Comments submitted here are emailed directly to Alex.</p>

    <form action="https://formsubmit.co/alexlange@gwu.edu" method="POST">

        <input type="hidden" name="_subject" value="New Website Comment">

        <input type="hidden" name="_captcha" value="false">

        <input type="hidden" name="_template" value="table">

        <input type="hidden" id="userField" name="User">

        <textarea
            name="Comment"
            placeholder="Write your note here..."
            required></textarea>

        <button type="submit">Send Note</button>

    </form>

    <br>

    <a class="back-link" href="index.html">← Return Home</a>

</div>

<script>

const users = {
    "Mira"    : "Mira",
    "Shaggy"  : "Shaggy",
    "Radley"  : "Radley",
    "Alain"   : "Alain",
    "Dale"    : "Dale",
    "Brennan" : "Brennan",
    "Hank"    : "Hank"
};

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (
        users.hasOwnProperty(username) &&
        users[username] === password
    ) {

        document.getElementById("loginSection").style.display = "none";

        document.getElementById("commentSection").style.display = "block";

        document.getElementById("userField").value = username;

    } else {

        document.getElementById("error").innerText =
            "Incorrect username or password.";

    }
}

</script>

</body>
</html>
